function mergedPlaces(state) {
const added = (state.exploreAdded || []);

[...SEED_PLACES, ...added].forEach(p => { byId[p.id] = { ...(byId[p.id] || {}), ...p }; });

const st = (state.exploreStatus && state.exploreStatus[p.id]) || {};

return { ...p, seed: SEED_IDS.has(p.id), plannedDay, been: !!st.been, rated: !!st.rated };
});
}
// Normalised key for duplicate detection: name (letters/digits only, accent-folded)
// + lowercased city. Two places with the same key are considered the same place.
function placeKey(name, city) {
  return (name || "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "") + "|" + (city || "").toLowerCase().trim();
}
function findDup(places, name, city, exceptId) {
  const k = placeKey(name, city);
  return (places || []).find(p => p.id !== exceptId && placeKey(p.name, p.city) === k) || null;
}
function heroPhoto(state, dayIndex, city) {
  const j = (state.journal || []);
  // Prefer a photo logged on this exact day, else any photo from this city.
  const sameDay = j.find(e => e.day === dayIndex && e.photos && e.photos.length);
  if (sameDay) return sameDay.photos[0].src;
  const sameCity = j.find(e => e.city === city && e.photos && e.photos.length);
  return sameCity ? sameCity.photos[0].src : null;
}

// Build a Google Maps walking-directions URL through a day's planned places.
// Origin is intentionally omitted: Maps then starts from the user's current
// location (the hotel, in practice). One place falls back to a simple search.
function mapDayUrl(places) {
const pts = places.map(p => encodeURIComponent([p.name, (p.area || "").replace(/·/g, ","), p.city].filter(Boolean).join(", ")));
if (!pts.length) return null;
if (pts.length === 1) return `https://www.google.com/maps/search/?api=1&query=${pts[0]}`;
return `https://www.google.com/maps/dir/?api=1&destination=${pts[pts.length - 1]}&waypoints=${pts.slice(0, -1).join("%7C")}&travelmode=walking`;
}

// Open a single place in Google Maps, searching by name + area + city.
function mapPlaceUrl(p) {
const q = [p.name, (p.area || "").replace(/·/g, ","), p.city].filter(Boolean).join(", ");
return q ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}` : null;
}
// Open a free-text query (e.g. a hotel/venue title + city) in Google Maps.
function mapQueryUrl(q) {
const s = (q || "").trim();
return s ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s)}` : null;
}

const CCY = {

"France":{code:"EUR",sym:"€"},"Germany":{code:"EUR",sym:"€"},"Italy":{code:"EUR",sym:"€"},"Spain":{code:"EUR",sym:"€"},

"Denmark":{code:"DKK",sym:"kr"},"Sweden":{code:"SEK",sym:"kr"},"Norway":{code:"NOK",sym:"kr"},"Switzerland":{code:"CHF",sym:"CHF"},
"Czechia":{code:"CZK",sym:"Kč"},"Czech Republic":{code:"CZK",sym:"Kč"},"Poland":{code:"PLN",sym:"zł"},"Hungary":{code:"HUF",sym:"Ft"},
"Japan":{code:"JPY",sym:"¥"},"China":{code:"CNY",sym:"¥"},"Thailand":{code:"THB",sym:"฿"},"Singapore":{code:"SGD",sym:"$"},
"Malaysia":{code:"MYR",sym:"RM"},"Indonesia":{code:"IDR",sym:"Rp"},"India":{code:"INR",sym:"₹"},"Vietnam":{code:"VND",sym:"₫"},
"New Zealand":{code:"NZD",sym:"$"},"Canada":{code:"CAD",sym:"$"},"Mexico":{code:"MXN",sym:"$"},"Brazil":{code:"BRL",sym:"R$"},
"United Arab Emirates":{code:"AED",sym:"AED"},"Turkey":{code:"TRY",sym:"₺"},"South Korea":{code:"KRW",sym:"₩"},"Hong Kong":{code:"HKD",sym:"$"},
"South Africa":{code:"ZAR",sym:"R"},"Iceland":{code:"ISK",sym:"kr"},
};
function ccyOf(country){ return (country && CCY[country]) || null; }
function symOf(code){ const x = Object.values(CCY).find(c => c.code === code); return x ? x.sym : ""; }
function fmtRate(v){ if(v==null) return "—"; if(v>=100) return Math.round(v).toLocaleString("en-AU"); if(v>=10) return v.toFixed(1); return v.toFixed(2); }
function fmtMoney(v){ if(!isFinite(v)) v=0; return (Math.round(v*100)/100).toLocaleString("en-AU",{minimumFractionDigits:2,maximumFractionDigits:2}); }

// Live FX rates from open.er-api.com (keyless, CORS). Cached in localStorage and
// shown instantly; refreshed in the background when older than a day. Returns
// null until any rates (cached or live) exist, so callers degrade gracefully.
function useRates(homeCode){
const [data, setData] = useState(() => { try { return JSON.parse(localStorage.getItem("fx:"+homeCode) || "null"); } catch(e){ return null; } });
useEffect(() => {
if (!homeCode) return;
let on = true, cached = null;
try { cached = JSON.parse(localStorage.getItem("fx:"+homeCode) || "null"); } catch(e){}
if (cached && cached.base === homeCode) setData(cached);
if (cached && cached.base === homeCode && (Date.now() - (cached.fetchedAt||0) < 24*3600*1000)) return;
fetch("https://open.er-api.com/v6/latest/"+homeCode)
.then(r => r.ok ? r.json() : null)
.then(j => { if (on && j && j.rates) { const obj = { base: homeCode, rates: j.rates, date: j.time_last_update_utc || "", fetchedAt: Date.now() }; setData(obj); try { localStorage.setItem("fx:"+homeCode, JSON.stringify(obj)); } catch(e){} } })
.catch(() => {});
return () => { on = false; };
}, [homeCode]);
if (!data || data.base !== homeCode) return null;
return { ...data, stale: (Date.now() - (data.fetchedAt||0) > 36*3600*1000) };
}

// Small FX chip for the current region (home -> local). Tap opens a converter
// sheet. Hidden when there is no home currency, no local currency, or they match.
function FxChip({ homeCode, homeSym, country, tripCountries }){
const local = ccyOf(country);
const rates = useRates(homeCode);
const [open, setOpen] = useState(false);
if (!homeCode || !local || local.code === homeCode) return null;
const rate = rates && rates.rates ? rates.rates[local.code] : null;
return (
<>
<button className="fxchip" onClick={() => setOpen(true)} aria-label="Currency converter">
<span className="fxchip-rate">{homeSym}1 <span className="fxchip-arr">→</span> {local.sym}{fmtRate(rate)}</span>
<span className="fxchip-code">{homeCode} → {local.code}</span>
</button>
{open && <FxSheet homeCode={homeCode} homeSym={homeSym} local={local} rates={rates} tripCountries={tripCountries} onClose={() => setOpen(false)} />}
</>
);
}

function FxSheet({ homeCode, homeSym, local, rates, tripCountries, onClose }){
const [amt, setAmt] = useState("100");
const [flip, setFlip] = useState(false); // false: home -> local, true: local -> home
const rate = rates && rates.rates ? rates.rates[local.code] : null;
const n = parseFloat(amt) || 0;
const out = rate ? (flip ? n / rate : n * rate) : 0;
const toSym = flip ? homeSym : local.sym;
const fromCode = flip ? local.code : homeCode, toCode = flip ? homeCode : local.code;
const others = Array.from(new Set((tripCountries||[]).map(c => { const x = ccyOf(c); return x ? x.code : null; }).filter(Boolean)))
.filter(code => code !== homeCode && code !== local.code)
.map(code => ({ code, sym: symOf(code) }));
return createPortal(
<div className="sheet" onClick={onClose}>
<div className="sheetcard" onClick={e => e.stopPropagation()}>
<div className="sheethead">
<div className="sheettitle">Currency</div>
<button className="sheetx" onClick={onClose} aria-label="Close"><X size={16} /></button>
</div>
<div className="fxbig">{homeSym}1 = {local.sym}{fmtRate(rate)} <span className="fxbig-code">{local.code}</span></div>
<div className="fxconv">
<label className="fxconv-cell"><span className="fxconv-code">{fromCode}</span><input className="fxconv-input" type="number" inputMode="decimal" value={amt} onChange={e => setAmt(e.target.value)} /></label>
<button className="fxswap" onClick={() => setFlip(f => !f)} aria-label="Swap direction">⇄</button>
<div className="fxconv-cell out"><span className="fxconv-code">{toCode}</span><div className="fxconv-out">{toSym}{fmtMoney(out)}</div></div>
</div>
<div className="muted xs fxnote">Indicative mid-market rate{rates && rates.date ? ` · ${rates.date}` : ""}{rates && rates.stale ? " · may be out of date offline" : ""}</div>
{others.length > 0 && (
<>
<div className="section-label">Other regions on this trip</div>
<div className="fxlist">
{others.map(o => <div className="fxlistrow" key={o.code}><span className="fxlistrow-code">{o.code}</span><span className="fxlistrow-val">{homeSym}1 ≈ {o.sym}{fmtRate(rates && rates.rates ? rates.rates[o.code] : null)}</span></div>)}
</div>
</>
)}
</div>
</div>
, document.body);
}

// Compress a photo client-side before upload: max 1600px long edge, JPEG ~0.82.
// Cuts typical phone photos by ~90% for roaming upload. Falls back to the
// original file on any failure (e.g. unsupported format), so uploads never break.
async function compressImage(file, maxDim = 1600, quality = 0.82) {
try {
const bmp = await createImageBitmap(file);
const scale = Math.min(1, maxDim / Math.max(bmp.width, bmp.height));
if (scale === 1 && file.size < 900000) return file;
const canvas = document.createElement("canvas");
canvas.width = Math.max(1, Math.round(bmp.width * scale));
canvas.height = Math.max(1, Math.round(bmp.height * scale));
canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", quality));
return blob || file;

// Read all SHARED PUBLIC-READ data from Supabase into the app state shape.
// NOTE: private_notes is intentionally NOT fetched here. It is authenticated-only
// and loaded separately via loadPrivateNotes() so viewer mode never requests it.
async function loadAll() {
const [placesRes, statusRes, journalRes, photosRes] = await Promise.all([
supabase.from("places").select("*"),
supabase.from("place_status").select("*"),
supabase.from("journal_entries").select("*").order("ts", { ascending: false }),
supabase.from("journal_photos").select("*"),
]);
// If the core tables both failed (network down, Supabase outage), surface it
// rather than silently rendering an empty trip.
if (placesRes.error && journalRes.error) throw new Error("Trip data failed to load");
const exploreAdded = (placesRes.data || []).map(r => ({ id: r.id, city: r.city, cat: r.cat, tag: r.tag, name: r.name, area: r.area || "", note: r.note || "" }));
const exploreStatus = {};
(statusRes.data || []).forEach(r => {
exploreStatus[r.place_id] = { plannedDay: r.planned_day, been: !!r.been, rated: !!r.rated };
});
const photosByJournal = {};
(photosRes.data || []).forEach(ph => {
(photosByJournal[ph.journal_id] = photosByJournal[ph.journal_id] || []).push({ id: ph.id, src: ph.url || photoPublicUrl(ph.path), path: ph.path, name: ph.caption || "" });
});
const journal = (journalRes.data || []).map(r => ({
id: r.id, type: r.type, title: r.title, note: r.note || "", you: r.you || 0, her: r.her || 0,
region: r.region || "", vintage: r.vintage || "", city: r.city || "", day: r.day, ts: r.ts, place_id: r.place_id || null,
photos: photosByJournal[r.id] || [],
}));
return { exploreAdded, exploreStatus, journal };
}

// Authenticated-only load of private logistics. Returns {} on any denial/error
// so the app tolerates anon denial gracefully and never surfaces private data.
async function loadPrivateNotes() {
try {
const [pnRes, inboxRes] = await Promise.all([
supabase.from("private_notes").select("*").order("day", { ascending: true }).order("sort_order", { ascending: true }),

// Calls the assistant (place mode). Accepts free text or a URL (`input`) and/or
// image File objects (`files`); returns an array of structured place items.
// Throws on failure so callers can fall back to manual entry.
async function aiCapture({ input = "", files = [], enrich = false }, accessToken) {
  const images = [];
  for (const f of (files || []).slice(0, 4)) {
    let g = f;
    if (f.type && f.type.startsWith("image/")) { try { g = await compressImage(f); } catch (e) {} }
    images.push({ mimeType: g.type || f.type || "image/jpeg", data: await fileToBase64(g) });
  }
  // Guard oversized payloads (e.g. an iOS HEIC that failed to compress) so the
  // request fails fast with a clear message instead of a slow dead end.
  const b64Total = images.reduce((n, im) => n + (im.data ? im.data.length : 0), 0);
  if (images.length && b64Total > 8000000) throw new Error("images too large");
  const r = await fetch(`${SUPABASE_URL}/functions/v1/assistant`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${accessToken}` },
    body: JSON.stringify({ mode: "place", input, images, enrich }),
  });
  if (!r.ok) throw new Error("assistant request failed");
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return Array.isArray(j.items) ? j.items : (j.place && j.place.name ? [j.place] : []);
}

// Asks the same edge function (story mode) to write a short, grounded trip recap
// from the journal entries. Authenticated users only; key stays server side.
async function aiStory(entries, trip, accessToken) {
const r = await fetch(`${SUPABASE_URL}/functions/v1/assistant`, {
method: "POST",
headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${accessToken}` },
body: JSON.stringify({ mode: "story", entries, trip }),
});
if (!r.ok) throw new Error("story request failed");
const j = await r.json();
if (j.error) throw new Error(j.error);
return j.text || "";
}

// Read a File/Blob to a base64 string (no data: prefix).
function fileToBase64(file) {
return new Promise((resolve, reject) => {
const r = new FileReader();
r.onload = () => resolve(String(r.result).split(",")[1] || "");
r.onerror = reject;
r.readAsDataURL(file);
});
}

// Sends a PDF or photo of a ticket/itinerary to the assistant (doc mode) and gets
// back structured logistics items. Images are compressed first; the Gemini key
// stays server side and the call requires a signed-in user.
async function aiExtractDoc(file, accessToken) {
let f = file;
if (file.type && file.type.startsWith("image/")) { try { f = await compressImage(file); } catch (e) {} }
const data = await fileToBase64(f);
const mimeType = (f.type || file.type || "application/pdf");
const r = await fetch(`${SUPABASE_URL}/functions/v1/assistant`, {
method: "POST",
headers: { "Content-Type": "application/json", "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${accessToken}` },
body: JSON.stringify({ mode: "doc", mimeType, data }),
});
if (!r.ok) throw new Error("doc request failed");
const j = await r.json();
if (j.error) throw new Error(j.error);
return Array.isArray(j.items) ? j.items : [];
}

// One-time migration of legacy device-only localStorage data into Supabase.
async function migrateLegacyOnce() {
try {
if (localStorage.getItem(MIGRATED_KEY)) return;
const raw = localStorage.getItem(LEGACY_KEY);
if (!raw) { localStorage.setItem(MIGRATED_KEY, "1"); return; }
const parsed = JSON.parse(raw);
if (!parsed || typeof parsed !== "object") { localStorage.setItem(MIGRATED_KEY, "1"); return; }
// Custom added places
for (const p of (parsed.exploreAdded || [])) {
try { await db.addPlace(p); } catch (e) {}
}
// Place status
for (const pid of Object.keys(parsed.exploreStatus || {})) {
const st = parsed.exploreStatus[pid] || {};
try { await db.upsertStatus(pid, { plannedDay: ("plannedDay" in st ? st.plannedDay : null), been: !!st.been, rated: !!st.rated }); } catch (e) {}
}
// Journal entries (text only; legacy base64 photos are NOT uploaded — they remain on the original device).
for (const j of (parsed.journal || [])) {
try { await db.addJournal({ id: j.id || uid(), type: j.type, title: j.title, note: j.note, you: j.you, her: j.her, region: j.region, vintage: j.vintage, city: j.city, day: j.day, ts: j.ts || Date.now(), place_id: j.place_id || null }); } catch (e) {}
}
localStorage.setItem(MIGRATED_KEY, "1");
} catch (e) { /* leave legacy data intact if migration fails */ }
}

function WeatherGlyph({ kind, size = 22 }) {
const p = { size, strokeWidth: 1.6 };
if (kind === "sun") return <Sun {...p} />;
if (kind === "cloud") return <Cloud {...p} />;
if (kind === "cloudrain") return <CloudRain {...p} />;
return <CloudSun {...p} />;
}

// Map a WMO weather code (Open-Meteo) to our glyph kind + short condition text.
function wmo(code) {
if (code === 0) return { icon: "sun", cond: "Clear" };
if (code === 1 || code === 2) return { icon: "cloudsun", cond: "Partly cloudy" };
if (code === 3) return { icon: "cloud", cond: "Overcast" };
if (code === 45 || code === 48) return { icon: "cloud", cond: "Fog" };
if (code >= 51 && code <= 57) return { icon: "cloudrain", cond: "Drizzle" };
if (code >= 61 && code <= 67) return { icon: "cloudrain", cond: "Rain" };
if (code >= 71 && code <= 77) return { icon: "cloud", cond: "Snow" };
if (code >= 80 && code <= 82) return { icon: "cloudrain", cond: "Rain showers" };
if (code >= 85 && code <= 86) return { icon: "cloud", cond: "Snow showers" };
if (code >= 95) return { icon: "cloudrain", cond: "Thunderstorms" };
return { icon: "cloudsun", cond: "Mixed sky" };
}

// Fetch a live forecast from Open-Meteo (no API key, CORS-enabled). Returns
// null on any failure so callers fall back to the static CLIMATE averages.
async function fetchWeather(coords) {
try {
const u = `https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}`
+ `&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code`
+ `&timezone=auto&forecast_days=1`;
const r = await fetch(u);
if (!r.ok) return null;
const j = await r.json();
const cur = j.current || {};
const day = j.daily || {};
const code = (day.weather_code && day.weather_code[0] != null) ? day.weather_code[0] : cur.weather_code;
const w = wmo(code);
return {
temp: Math.round(cur.temperature_2m),
hi: Math.round(day.temperature_2m_max[0]),
lo: Math.round(day.temperature_2m_min[0]),
icon: w.icon, cond: w.cond,
};
} catch (e) { return null; }
}

// Live weather for a given itinerary weather-key (e.g. "Bordeaux"). Refetches
// when the key changes and whenever the app returns to the foreground. Keys
// without coordinates (transit days) stay null, so the static fallback shows.
function useLiveWeather(wKey) {
const [live, setLive] = useState(null);
useEffect(() => {
let on = true;
setLive(null);
const coords = CITY_COORDS[wKey];
if (!coords) return;
const go = () => fetchWeather(coords).then(w => { if (on && w) setLive(w); });
go();
const onVis = () => { if (document.visibilityState === "visible") go(); };
document.addEventListener("visibilitychange", onVis);
return () => { on = false; document.removeEventListener("visibilitychange", onVis); };
}, [wKey]);
return live;
}

/* ============================== STATUS WRITER ============================== */

// Optimistic place_status writer: update UI immediately, persist to Supabase.
function useSetStatus(ctx) {
return (id, patch) => {
ctx.setState(s => ({ ...s, exploreStatus: { ...s.exploreStatus, [id]: { ...(s.exploreStatus[id] || {}), ...patch } } }));
if (ctx.canEdit) { ctx.db.upsertStatus(id, patch).catch(() => ctx.flash("Sync failed — retry")); }
else ctx.flash("Sign in to make changes");
};
}

/* ============================== PRIVATE NOTES (logged-in only) ============================== */

// Renders private logistics for a given day index. Only ever mounted when ctx.canEdit
// is true, so logged-out viewer mode never renders private note data.
function PrivateNotes({ ctx, dayIndex, compact }) {
const { state, copy, canEdit, db, setState, flash, session } = ctx;
const [adding, setAdding] = useState(false);
const [reading, setReading] = useState(false);
if (!canEdit) return null;
const notes = (state.privateNotes || []).filter(n => n.day === dayIndex);
const groups = PRIVATE_TYPE_ORDER
.map(t => ({ type: t, items: notes.filter(n => n.type === t) }))
.filter(g => g.items.length);
const cityHint = (() => { const c = (ITINERARY[dayIndex] || {}).city || ""; return c === "Transit" ? "" : c; })();

const del = async (id) => {
const prev = state.privateNotes;
setState(s => ({ ...s, privateNotes: (s.privateNotes || []).filter(n => n.id !== id) }));
try { await db.deletePrivateNote(id); flash("Private note removed"); }
catch (e) { flash("Delete failed"); setState(s => ({ ...s, privateNotes: prev })); }
};
const addNote = async (note) => {
const entry = { id: uid(), day: dayIndex, type: note.type, title: note.title, body: note.body, ref: note.ref, url: "", sort_order: 0 };
setState(s => ({ ...s, privateNotes: [ ...(s.privateNotes || []), entry ] }));
setAdding(false);
try { await db.addPrivateNote(entry); flash("Private note added"); }
catch (e) { flash("Could not save note"); }
};

// Upload a PDF or photo of a ticket/itinerary; the assistant extracts the
// logistics and we add them straight to this day (each is editable/removable).
const onDoc = async (e) => {
const file = e.target.files && e.target.files[0];
e.target.value = "";
if (!file) return;
if (file.size > 8 * 1024 * 1024) { flash("File too large (max 8MB)"); return; }
setReading(true);
try {
const items = await aiExtractDoc(file, session && session.access_token);
if (!items.length) { flash("No travel details found in that file"); }
else {
const added = items.map(it => ({ id: uid(), day: dayIndex, type: PRIVATE_TYPE_ORDER.includes(it.type) ? it.type : "note", title: it.title || "Booking", body: it.body || "", ref: it.ref || "", url: "", sort_order: 0 }));
setState(s => ({ ...s, privateNotes: [ ...(s.privateNotes || []), ...added ] }));
for (const entry of added) { try { await db.addPrivateNote(entry); } catch (err) {} }
flash(`Added ${added.length} ${added.length === 1 ? "item" : "items"} from your document`);
setAdding(false);
}
} catch (err) { flash("Couldn't read that document"); }
setReading(false);
};
const uploadBtn = (
<label className="privupload">
<ImagePlus size={14} /> {reading ? "Reading your document…" : "Attach ticket or itinerary"}
<input type="file" accept="application/pdf,image/*" disabled={reading} onChange={onDoc} />
</label>
);

if (!notes.length && !adding) {
return (
<div className="privsec">
<div className="privhead"><Bed size={13} /> Private logistics</div>
<button className="privadd" onClick={() => setAdding(true)}><Plus size={14} /> Add private note</button>
{uploadBtn}
</div>
);
}
return (
<div className="privsec">
<div className="privhead"><Bed size={13} /> Private logistics<span className="privlock">logged-in only</span></div>
{groups.map(g => {
const Ic = privateTypeMeta(g.type).icon;
return (
<div key={g.type} className="privgroup">
<div className="privgroup-label"><Ic size={12} /> {privateTypeMeta(g.type).label}</div>
{g.items.map(n => (
<div key={n.id} className={"privrow" + (compact ? " compact" : "")}>
<div className="privrow-body">
<div className="privrow-title">{n.title}</div>
{n.body && <div className="muted xs">{n.body}</div>}
{n.ref && <button className="reflink xs" onClick={() => copy(n.ref, "Private ref")}><span>{n.ref}</span><Copy size={11} /></button>}
{(n.type === "hotel" || n.type === "ticket") && mapQueryUrl([n.title, cityHint].filter(Boolean).join(", ")) &&
<a className="privmap" href={mapQueryUrl([n.title, cityHint].filter(Boolean).join(", "))} target="_blank" rel="noopener noreferrer"><MapIcon size={11} /> Map</a>}
</div>
<button className="del" onClick={() => del(n.id)}><Trash2 size={13} /></button>
</div>
))}
</div>
);
})}
{adding
? <AddPrivateNote onCancel={() => setAdding(false)} onAdd={addNote} />
: <><button className="privadd" onClick={() => setAdding(true)}><Plus size={14} /> Add private note</button>{uploadBtn}</>}
</div>
);
}

function AddPrivateNote({ onAdd, onCancel }) {
const [type, setType] = useState("note");
const [title, setTitle] = useState("");
const [body, setBody] = useState("");
const [ref, setRef] = useState("");
const go = () => { if (!title.trim()) return; onAdd({ type, title: title.trim(), body: body.trim(), ref: ref.trim() }); };
return (
<div className="privadd-form">
<select className="sel full" value={type} onChange={e => setType(e.target.value)}>{PRIVATE_TYPE_ORDER.map(t => <option key={t} value={t}>{privateTypeMeta(t).label}</option>)}</select>
<input className="inline-input full" placeholder="Title (e.g. Hotel, Flight)…" value={title} onChange={e => setTitle(e.target.value)} />
<input className="inline-input full" placeholder="Details (optional)…" value={body} onChange={e => setBody(e.target.value)} />
<input className="inline-input full" placeholder="Reference / booking code (optional)…" value={ref} onChange={e => setRef(e.target.value)} />
<div className="btnrow"><button className="primary grow" onClick={go}><Plus size={15} /> Add</button><button className="ghostbtn" onClick={onCancel}>Cancel</button></div>
</div>
);
}

/* ============================== JOURNAL ============================== */

function Journal(ctx) {
const { state, setState, tIndex, stats, flash, canEdit, db, refresh } = ctx;
const setStatus = useSetStatus(ctx);
const d = ITINERARY[tIndex];
const [type, setType] = useState("Meal");
const [title, setTitle] = useState("");
const [note, setNote] = useState("");
const [you, setYou] = useState(0);
const [her, setHer] = useState(0);
const [region, setRegion] = useState("");
const [vintage, setVintage] = useState("");
const [files, setFiles] = useState([]);
const [busy, setBusy] = useState(false);
const [viewer, setViewer] = useState(null);
const [editing, setEditing] = useState(null);
const [jview, setJview] = useState("diary");

const add = async () => {
if (!title.trim()) return;
if (!canEdit) { flash("Sign in to add entries"); return; }
setBusy(true);
const entry = { id: uid(), type, title: title.trim(), note: note.trim(), you, her, region: region.trim(), vintage: vintage.trim(), city: d.city, day: tIndex, ts: Date.now(), place_id: null, photos: [] };
try {
await db.addJournal(entry);
const uploaded = [];
for (const f of files) { try { uploaded.push(await db.uploadPhoto(entry.id, f)); } catch (e) { flash("A photo failed to upload"); } }
files.forEach(f => { try { URL.revokeObjectURL(f.__preview); } catch (e) {} });
entry.photos = uploaded;
setState(s => ({ ...s, journal: [entry, ...s.journal] }));
setTitle(""); setNote(""); setYou(0); setHer(0); setRegion(""); setVintage(""); setFiles([]);
flash("Saved");
} catch (e) { flash("Could not save entry"); }
setBusy(false);
};
const del = async (id) => {
if (!window.confirm("Delete this entry? Its photos will be removed too.")) return;
const prev = state.journal;
setState(s => ({ ...s, journal: s.journal.filter(j => j.id !== id) }));
if (!canEdit) { flash("Sign in to delete"); setState(s => ({ ...s, journal: prev })); return; }
try { await db.deleteJournal(id); } catch (e) { flash("Delete failed"); setState(s => ({ ...s, journal: prev })); }
};
const avg = (k) => stats.rated.length ? (stats.rated.reduce((a, j) => a + j[k], 0) / stats.rated.length).toFixed(1) : "–";
const toRate = mergedPlaces(state).filter(p => p.been && !p.rated);

// Group entries by trip day so the journal reads like a dated diary: newest
// day first, entries within a day newest first. Entries with no day fall into
// a trailing "Earlier" group.
const journalGroups = useMemo(() => {
const by = {};
state.journal.forEach(j => { const k = (j.day != null ? j.day : -1); (by[k] = by[k] || []).push(j); });
return Object.keys(by).map(Number).sort((a, b) => b - a).map(day => ({
day, items: by[day].slice().sort((a, b) => (b.ts || 0) - (a.ts || 0)),
}));
}, [state.journal]);

const photoEntries = useMemo(() => state.journal.filter(j => (j.photos || []).length).slice().sort((a, b) => (b.ts || 0) - (a.ts || 0)), [state.journal]);

const renderJCard = (j) => {
const Ic = TYPE_META[j.type].icon;
const split = j.you > 0 && j.her > 0 && Math.abs(j.you - j.her) >= 2;
return (
<div key={j.id} className="jcard">
<div className="jcard-icon" style={{ color: TYPE_META[j.type].color, background: TYPE_META[j.type].bg }}><Ic size={16} /></div>
<div className={"jcard-body" + (canEdit ? " editable" : "")} onClick={() => { if (canEdit) setEditing(j); }}>
<div className="jcard-title">{j.title}{j.vintage ? <span className="vint"> {j.vintage}</span> : ""}</div>
{(j.region || j.city) && <div className="muted xs">{[j.region, j.city].filter(Boolean).join(" · ")}</div>}
{j.note && <div className="jcard-note">{j.note}</div>}
{!!(j.photos || []).length && <PhotoGrid photos={j.photos} onOpen={(idx) => setViewer({ photos: j.photos, index: idx })} />}
<div className="jcard-rate">
<MiniStars label="You" v={j.you} />
<MiniStars label="H" v={j.her} />
{split && <span className="split">split decision</span>}
</div>
</div>
{canEdit && <button className="del" onClick={() => del(j.id)} aria-label="Delete entry"><Trash2 size={14} /></button>}
</div>
);
};

return (
<div className="page">
<div className="page-h">Journal</div>

<div className="journal-stats">
<Stat label="Meals" value={stats.meals} />
<Stat label="Wines" value={stats.wines} />
<Stat label="You" value={avg("you")} accent />
<Stat label="Harriet" value={avg("her")} accent />
</div>

{stats.bestMeal && <div className="best"><Sparkles size={14} /><span>Best meal so far: <strong>{stats.bestMeal.title}</strong> ({stats.bestMeal.city})</span></div>}

<div className="segmented"><button className={"segbtn" + (jview === "diary" ? " on" : "")} onClick={() => setJview("diary")}>Diary</button><button className={"segbtn" + (jview === "gallery" ? " on" : "")} onClick={() => setJview("gallery")}>Gallery</button></div>

{jview === "diary" && (<>
{toRate.length > 0 && (
<>
<div className="section-label">Still to rate</div>
{toRate.map(p => <RatePrompt key={p.id} place={p} ctx={ctx} setStatus={setStatus} />)}
</>
)}

{canEdit && (
<Card>
<div className="typetabs">
{Object.keys(TYPE_META).map(tp => {
const Ic = TYPE_META[tp].icon;
return <button key={tp} className={"typetab" + (type === tp ? " on" : "")} style={type === tp ? { color: TYPE_META[tp].color } : undefined} onClick={() => setType(tp)}><Ic size={15} /> {tp}</button>;
})}
</div>
<input className="inline-input full" placeholder={type === "Wine" ? "Producer / wine name…" : type === "Moment" ? "What happened…" : "Name…"} value={title} onChange={e => setTitle(e.target.value)} />
{type === "Wine" && (
<div className="addrow">
<input className="inline-input" placeholder="Region / appellation" value={region} onChange={e => setRegion(e.target.value)} />
<input className="inline-input vintage" placeholder="Vintage" value={vintage} onChange={e => setVintage(e.target.value)} />
</div>
)}
<input className="inline-input full" placeholder="Tasting note / thoughts…" value={note} onChange={e => setNote(e.target.value)} />
<PhotoPicker files={files} setFiles={setFiles} flash={flash} canEdit={canEdit} />
<div className="ratepair">
<RateRow label="You" value={you} onChange={setYou} />
<RateRow label="Harriet" value={her} onChange={setHer} />
</div>

);
})}

// Edit an existing journal entry in place: type, name, city, notes, ratings,
// and photos (remove existing, add new). Reuses the Add Entry form anatomy
// inside an iOS-style bottom sheet so nothing new is added to the tab bar.
function EditEntry({ entry, ctx, onClose }) {
const { setState, flash, db, canEdit } = ctx;
const [type, setType] = useState(entry.type);
const [title, setTitle] = useState(entry.title);
const [note, setNote] = useState(entry.note || "");
const [city, setCity] = useState(entry.city || "");
const [region, setRegion] = useState(entry.region || "");
const [vintage, setVintage] = useState(entry.vintage || "");
const [you, setYou] = useState(entry.you || 0);
const [her, setHer] = useState(entry.her || 0);
const [photos, setPhotos] = useState(entry.photos || []);
const [files, setFiles] = useState([]);
const [busy, setBusy] = useState(false);

// Removing an existing photo deletes it from shared storage immediately,
// and keeps the parent journal state consistent so a Cancel cannot show
// a photo that no longer exists.
const removePhoto = async (ph) => {
if (!window.confirm("Remove this photo from the entry and shared storage?")) return;
setPhotos(ps => ps.filter(p => p.id !== ph.id));
setState(s => ({ ...s, journal: s.journal.map(j => j.id === entry.id ? { ...j, photos: (j.photos || []).filter(p => p.id !== ph.id) } : j) }));
try { await db.deletePhoto(ph); flash("Photo removed"); } catch (e) { flash("Could not remove photo"); }
};

const save = async () => {
if (!title.trim()) return;
if (!canEdit) { flash("Sign in to edit"); return; }
setBusy(true);
const patch = { id: entry.id, type, title: title.trim(), note: note.trim(), you, her, region: region.trim(), vintage: vintage.trim(), city: city.trim() };
try {
await db.updateJournal(patch);
const uploaded = [];
for (const f of files) { try { uploaded.push(await db.uploadPhoto(entry.id, f)); } catch (e) { flash("A photo failed to upload"); } }
files.forEach(f => { try { URL.revokeObjectURL(f.__preview); } catch (e) {} });
const nextPhotos = [...photos, ...uploaded];
setState(s => ({ ...s, journal: s.journal.map(j => j.id === entry.id ? { ...j, ...patch, photos: nextPhotos } : j) }));
flash("Updated");
onClose();
} catch (e) { flash("Could not update entry"); }
setBusy(false);
};

return (
<Sheet title="Edit entry" onClose={onClose}>
<div className="typetabs">
{Object.keys(TYPE_META).map(tp => {
const Ic = TYPE_META[tp].icon;
return <button key={tp} className={"typetab" + (type === tp ? " on" : "")} style={type === tp ? { color: TYPE_META[tp].color } : undefined} onClick={() => setType(tp)}><Ic size={15} /> {tp}</button>;
})}
</div>
<input className="inline-input full" placeholder={type === "Wine" ? "Producer / wine name…" : type === "Moment" ? "What happened…" : "Name…"} value={title} onChange={e => setTitle(e.target.value)} />
{type === "Wine" && (
<div className="addrow">
<input className="inline-input" placeholder="Region / appellation" value={region} onChange={e => setRegion(e.target.value)} />
<input className="inline-input vintage" placeholder="Vintage" value={vintage} onChange={e => setVintage(e.target.value)} />
</div>
)}
<input className="inline-input full" placeholder="City / location" value={city} onChange={e => setCity(e.target.value)} />
<input className="inline-input full" placeholder="Tasting note / thoughts…" value={note} onChange={e => setNote(e.target.value)} />
{!!photos.length && (
<div className="photogrid edit">
{photos.map(ph => (
<div key={ph.id} className="photoeditcell">
<img src={ph.src} alt="" />
<button className="photox" onClick={() => removePhoto(ph)} aria-label="Remove photo"><X size={12} strokeWidth={3} /></button>
</div>
))}
</div>
)}
<PhotoPicker files={files} setFiles={setFiles} flash={flash} canEdit={canEdit} />
<div className="ratepair">
<RateRow label="You" value={you} onChange={setYou} />
<RateRow label="Harriet" value={her} onChange={setHer} />
</div>
<button className="primary" onClick={save} disabled={busy}><Check size={15} /> {busy ? "Saving…" : "Save changes"}</button>
</Sheet>
);
}

// Edit an Explore place in place. Curated seed places can be edited (the change
// is saved as a database override) but not deleted; user-added places can be both.
function EditPlace({ place, inboxId, ctx, onClose }) {
const { setState, flash, db, canEdit, state } = ctx;
const seed = SEED_IDS.has(place.id);
const [name, setName] = useState(place.name || "");
const [city, setCity] = useState(place.city || EXPLORE_CITIES[0]);
const [cat, setCat] = useState(place.cat || CATS[0]);
const [tag, setTag] = useState(place.tag || VIBES[0]);
const [area, setArea] = useState(place.area || "");
const [note, setNote] = useState(place.note || "");
const setStatus = useSetStatus(ctx);
const [plan, setPlan] = useState(place.plannedDay != null ? place.plannedDay : null);
const firstCity = useRef(true);
useEffect(() => {
  if (firstCity.current) { firstCity.current = false; return; }
  setPlan(null);
}, [city]);
const fitDays = ITINERARY.map((d, i) => ({ i, d })).filter(x => x.d.city === city);
const [busy, setBusy] = useState(false);

const save = async () => {
if (!name.trim()) return;
if (!canEdit) { flash("Sign in to edit"); return; }
setBusy(true);
const saved = { id: place.id, city, cat, tag, name: name.trim(), area: area.trim(), note: note.trim() };
const dup = findDup(mergedPlaces(state), saved.name, saved.city, saved.id);
if (dup) { flash(`Already saved — ${dup.name}`); setBusy(false); return; }
setState(s => {
const list = s.exploreAdded || [];
const exists = list.some(x => x.id === saved.id);
return { ...s, exploreAdded: exists ? list.map(x => x.id === saved.id ? saved : x) : [...list, saved] };
});
try {
await db.upsertPlace(saved);
if (plan !== place.plannedDay) setStatus(saved.id, { plannedDay: plan });
if (inboxId) { setState(s => ({ ...s, inbox: (s.inbox || []).filter(i => i.id !== inboxId) })); db.deleteInbox(inboxId).catch(() => {}); }
flash(inboxId ? "Added to Explore" : "Place updated");
onClose();
}
catch (e) { flash("Could not update place"); }
setBusy(false);
};

const remove = async () => {
if (!window.confirm("Delete this place? This cannot be undone.")) return;
if (!canEdit) { flash("Sign in to delete"); return; }
setState(s => {
const status = { ...(s.exploreStatus || {}) };
delete status[place.id];
return { ...s, exploreAdded: (s.exploreAdded || []).filter(x => x.id !== place.id), exploreStatus: status };
});
try { await db.deletePlace(place.id); flash("Place removed"); onClose(); }
catch (e) { flash("Could not remove place"); }
};

return (
<Sheet title={inboxId ? "Sort into Explore" : "Edit place"} onClose={onClose}>
<input className="inline-input full" placeholder="Place name…" value={name} onChange={e => setName(e.target.value)} />
<select className="sel full" value={city} onChange={e => setCity(e.target.value)}>{EXPLORE_CITIES.map(c => <option key={c}>{c}</option>)}</select>
<select className="sel full" value={cat} onChange={e => setCat(e.target.value)}>{CATS.map(c => <option key={c}>{c}</option>)}</select>
<select className="sel full" value={tag} onChange={e => setTag(e.target.value)}>{VIBES.map(v => <option key={v}>{v}</option>)}</select>
<input className="inline-input full" placeholder="Area / neighbourhood (optional)" value={area} onChange={e => setArea(e.target.value)} />
<input className="inline-input full" placeholder="Note (optional)" value={note} onChange={e => setNote(e.target.value)} />
{fitDays.length > 0 && (
  <div className="dayfit">
    <div className="section-label" style={{ margin: "6px 4px 8px" }}>Plan for a day in {city}</div>
    <div className="daypicker">
      {fitDays.map(({ i, d }) => <button key={i} className={"dpbtn" + (plan === i ? " on" : "")} onClick={() => setPlan(plan === i ? null : i)}>{d.dow} {fmtDate(d.date)}</button>)}
      {plan != null && <button className="dpbtn clear" onClick={() => setPlan(null)}>Clear</button>}
    </div>
  </div>
)}
<button className="primary" onClick={save} disabled={busy}><Check size={15} /> {busy ? "Saving…" : "Save changes"}</button>
{!seed && <button className="dangerbtn" onClick={remove}><Trash2 size={15} /> Delete place</button>}
</Sheet>
);
}

function MultiReview({ drafts, onAdd, onEdit, onClose }) {
const [picked, setPicked] = useState(() => new Set(drafts.map(d => d.id)));
const toggle = (id) => setPicked(p => { const n = new Set(p); n.has(id) ? n.delete(id) : n.add(id); return n; });
return (
<Sheet title={`Add places · ${drafts.length} found`} onClose={onClose}>
{drafts.map(d => (
<div key={d.id} className={"reviewrow" + (picked.has(d.id) ? " on" : "")}>
<button className="reviewcheck" onClick={() => toggle(d.id)} aria-label="Toggle"><Check size={15} /></button>
<div className="reviewbody" onClick={() => onEdit(d)}>
<div className="reviewname">{d.name}</div>
<div className="xs">{[d.city, d.tag].filter(Boolean).join(" · ")}{d.confidence < AUTOADD_MIN ? " · check this one" : ""}</div>
</div>
</div>
))}
<button className="primary" onClick={() => onAdd(drafts.filter(d => picked.has(d.id)))}>Add {picked.size} place{picked.size === 1 ? "" : "s"}</button>
</Sheet>
);
}

function Explore(ctx) {
const { state, setState, tIndex, canEdit, db, flash, session, undoToast, pendingShare, setPendingShare, autoSort } = ctx;
const setStatus = useSetStatus(ctx);
const here = ITINERARY[tIndex].city;
const startCity = EXPLORE_CITIES.includes(here) ? here : "Paris";
const [city, setCity] = useState(startCity);
const [vibe, setVibe] = useState("All");
const [picker, setPicker] = useState(null);
const [adding, setAdding] = useState(false);
const [editing, setEditing] = useState(null);
const [cap, setCap] = useState("");
const [sorting, setSorting] = useState(null);
const [inboxId, setInboxId] = useState(null);

const places = mergedPlaces(state).filter(p => p.city === city);
const vibesHere = ["All", ...Array.from(new Set(places.map(p => p.tag)))];
const shown = vibe === "All" ? places : places.filter(p => p.tag === vibe);
const doneCount = places.filter(p => p.been).length;
const cityDays = ITINERARY.map((d, i) => ({ i, d })).filter(x => x.d.city === city);
const byCat = CATS.map(cat => ({ cat, items: shown.filter(p => p.cat === cat) })).filter(g => g.items.length);

const addPlace = async (place) => {
if (!canEdit) { flash("Sign in to add places"); return; }
setState(s => ({ ...s, exploreAdded: [ ...(s.exploreAdded || []), place ] }));
setAdding(false);
try { await db.addPlace(place); } catch (e) { flash("Could not save place"); }
};

const unsorted = (state.inbox || []).filter(i => !i.sorted);
const addCapture = (text0) => {
const text = (typeof text0 === "string" ? text0 : cap).trim();
if (!text) return;
if (!canEdit) { flash("Sign in to capture"); return; }
const item = { id: uid(), raw: text, kind: text.toLowerCase().startsWith("http") ? "link" : "note", city: "", sorted: false, created_at: new Date().toISOString() };
setState(s => ({ ...s, inbox: [item, ...(s.inbox || [])] }));
if (typeof text0 !== "string") setCap("");
if (autoSort) {
  // Auto-sort: keep the optimistic tray row for the brief "Sorting…" state,
  // but skip the DB write — reviewItems removes the row on a confident result.
  sortItem(item);
} else {
  db.addInbox(item).catch(() => flash("Could not save capture"));
}
};
const [capturing, setCapturing] = useState(false);
const captureFiles = async (fileList) => {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  if (!canEdit) { flash("Sign in to capture"); return; }
  setCapturing(true);
  try {
    const items = await aiCapture({ files }, session && session.access_token);
    reviewItems(items);
  } catch (e) { flash(String((e && e.message) || "").includes("too large") ? "Those photos are too large or unsupported — try a screenshot or JPEG" : "Couldn't read that — try again"); }
  setCapturing(false);
};
const removeCapture = (id) => {
setState(s => ({ ...s, inbox: (s.inbox || []).filter(i => i.id !== id) }));
db.deleteInbox(id).catch(() => {});
};
const sortItem = async (it) => {
  setSorting(it.id);
  try {
    const items = await aiCapture({ input: it.raw }, session && session.access_token);
    reviewItems(items, it.id);
  } catch (e) {
    flash("Agent unavailable, fill it in");
    setInboxId(it.id);
    setEditing(toDraft({ name: "", note: it.raw }));
  }
  setSorting(null);
};

// Normalise a raw model item into a full place draft for this app.
const toDraft = (it) => ({
id: uid(),
city: EXPLORE_CITIES.includes(it.city) ? it.city : (EXPLORE_CITIES.includes(city) ? city : "Paris"),
cat: CATS.includes(it.cat) ? it.cat : "Eat & Drink",
tag: VIBES.includes(it.tag) ? it.tag : VIBES[0],
name: it.name || "",
area: it.area || "",
note: it.note || "",
sources: Array.isArray(it.sources) ? it.sources : [],
confidence: typeof it.confidence === "number" ? it.confidence : 0.6,
});
const [review, setReview] = useState(null); // drafts[] for MultiReview, or null
// Route model items: auto-add the confident ones, review the rest.
const reviewItems = (items, sourceInboxId) => {
const drafts0 = (items || []).map(toDraft).filter(d => d.name);
// Drop anything already saved (same name+city) or repeated within this batch.
const existing = mergedPlaces(state);
const seen = new Set();
const drafts = drafts0.filter(d => {
  const k = placeKey(d.name, d.city);
  if (seen.has(k) || findDup(existing, d.name, d.city)) return false;
  seen.add(k); return true;
});
const skipped = drafts0.length - drafts.length;
if (skipped) flash(`Skipped ${skipped} already saved`);
if (!drafts.length) {
  if (skipped) { if (sourceInboxId) removeCapture(sourceInboxId); return; }
  flash("Nothing to add — fill it in");
  if (sourceInboxId) { setInboxId(sourceInboxId); setEditing(toDraft({ name: "" })); }
  return;
}
const confident = drafts.filter(d => d.confidence >= AUTOADD_MIN);
const rest = drafts.filter(d => d.confidence < AUTOADD_MIN);
if (drafts.length === 1 && !confident.length) { setInboxId(sourceInboxId || null); setEditing(drafts[0]); return; }
if (confident.length) {
setState(s => ({ ...s, exploreAdded: [ ...(s.exploreAdded || []), ...confident ] }));
confident.forEach(p => db.addPlace(p).catch(() => {}));
if (sourceInboxId) removeCapture(sourceInboxId);
const ids = new Set(confident.map(p => p.id));
undoToast(`Added ${confident.length} place${confident.length > 1 ? "s" : ""}`, () => {
setState(s => ({ ...s, exploreAdded: (s.exploreAdded || []).filter(p => !ids.has(p.id)) }));
confident.forEach(p => db.deletePlace && db.deletePlace(p.id).catch(() => {}));
});
}
if (rest.length) setReview(rest);
};

useEffect(() => {
  if (!pendingShare) return;
  const { input, file } = pendingShare;
  setPendingShare(null);
  if (file) { captureFiles([file]); return; }
  if (!input) return;
  (async () => {
    setSorting("__shared");
    try {
      const items = await aiCapture({ input }, session && session.access_token);
      reviewItems(items);
    } catch (e) { addCapture(input); flash("Saved to sort — agent unavailable"); }
    setSorting(null);
  })();
}, [pendingShare]);

return (
<div className="page">
<div className="page-h">Explore</div>
{canEdit && (
<div className="capture">
<div className="capture-row">
<input className="capture-input" placeholder="Paste a link or jot an idea…" value={cap} onChange={e => setCap(e.target.value)} onKeyDown={e => { if (e.key === "Enter") addCapture(); }} />
<button className="capture-add" onClick={addCapture} aria-label="Capture"><Plus size={16} /></button>
<label className={"capture-photo" + (capturing ? " busy" : "")} aria-label="Add a photo">
  <ImagePlus size={16} />
  <input type="file" accept="image/*" multiple capture="environment" disabled={capturing} onChange={e => { captureFiles(e.target.files); e.target.value = ""; }} />
</label>
</div>
{unsorted.length > 0 && (
<div className="tray">
<div className="tray-h">To sort · {unsorted.length}</div>
{unsorted.map(it => (
<div key={it.id} className="trayrow">
<div className="trayrow-raw">{it.raw}</div>
<div className="trayrow-actions">
<button className="sortbtn" disabled={sorting === it.id} onClick={() => sortItem(it)}><Sparkles size={13} /> {sorting === it.id ? "Sorting…" : "Sort"}</button>
<button className="del" onClick={() => removeCapture(it.id)} aria-label="Discard"><Trash2 size={13} /></button>
</div>
</div>
))}
</div>
)}
</div>
)}
<div className="citytabs">
{EXPLORE_CITIES.map(c => <button key={c} className={"citytab" + (city === c ? " on" : "")} onClick={() => { setCity(c); setVibe("All"); setPicker(null); }}>{c}</button>)}
</div>
<div className="city-meta">{doneCount} of {places.length} done in {city}</div>
<div className="vibebar">
{vibesHere.map(v => <button key={v} className={"vibechip" + (vibe === v ? " on" : "")} onClick={() => setVibe(v)}>{v}</button>)}
</div>
{byCat.length === 0 && <div className="muted sm empty pad">No ideas here yet. Add one below.</div>}
{byCat.map(g => (
<div key={g.cat}>
<div className="section-label">{g.cat}</div>
{g.items.map(p => {
const planned = p.plannedDay != null;
const day = planned ? ITINERARY[p.plannedDay] : null;
return (
<div key={p.id} className={"placecard" + (p.been ? " been" : "")}>
<button className="placecheck" onClick={() => setStatus(p.id, { been: !p.been })}><span className="box">{p.been && <Check size={13} strokeWidth={3} />}</span></button>
<div className="place-body">
<div className="place-top"><span className="place-name">{p.name}</span><span className="vibetag">{p.tag}</span></div>
{(p.area || p.note) && <div className="muted xs">{[p.area, p.note].filter(Boolean).join(" · ")}</div>}
<div className="place-actions">
{planned
? <button className="planpill" onClick={() => setPicker(picker === p.id ? null : p.id)}><CalendarDays size={12} /> {day.dow} {fmtDate(day.date)}</button>
: <button className="addday" onClick={() => setPicker(picker === p.id ? null : p.id)}><CalendarPlus size={13} /> Add to a day</button>}
{mapPlaceUrl(p) && <a className="maplink" href={mapPlaceUrl(p)} target="_blank" rel="noopener noreferrer"><MapIcon size={12} /> Map</a>}
{canEdit && <button className="editlink" onClick={() => setEditing(p)}><Pencil size={12} /> Edit</button>}
</div>
{picker === p.id && (
<div className="daypicker">
{cityDays.map(({ i, d }) => <button key={i} className={"dpbtn" + (p.plannedDay === i ? " on" : "")} onClick={() => { setStatus(p.id, { plannedDay: i }); setPicker(null); }}>{d.dow} {fmtDate(d.date)}</button>)}
{planned && <button className="dpbtn clear" onClick={() => { setStatus(p.id, { plannedDay: null }); setPicker(null); }}>Remove</button>}
</div>
)}
</div>
</div>
);
})}
</div>
))}
{canEdit && (adding
? <AddPlace city={city} onCancel={() => setAdding(false)} onAdd={addPlace} />
: <button className="addplace" onClick={() => setAdding(true)}><Plus size={16} /> Add a place</button>)}
{editing && <EditPlace place={editing} inboxId={inboxId} ctx={ctx} onClose={() => { setEditing(null); setInboxId(null); }} />}
{review && <MultiReview drafts={review}
onEdit={(d) => { setReview(null); setEditing(d); }}
onAdd={(chosen) => {
  setReview(null);
  const existing = mergedPlaces(state);
  const seen = new Set();
  const add = (chosen || []).filter(d => {
    const k = placeKey(d.name, d.city);
    if (seen.has(k) || findDup(existing, d.name, d.city)) return false;
    seen.add(k); return true;
  });
  const skipped = (chosen || []).length - add.length;
  if (add.length) { setState(s => ({ ...s, exploreAdded: [ ...(s.exploreAdded || []), ...add ] })); add.forEach(p => db.addPlace(p).catch(() => {})); }
  flash(add.length ? `Added ${add.length} place${add.length === 1 ? "" : "s"}${skipped ? `, skipped ${skipped}` : ""}` : "Already saved");
}}
onClose={() => setReview(null)} />}
</div>
);
}

function RatePrompt({ place, ctx, setStatus }) {

const [her, setHer] = useState(0);

entry.photos = uploaded;
setState(s => ({ ...s, journal: [entry, ...s.journal] }));

// Leaflet journey map. Uses circle markers + a dashed route line (no marker image
// assets, so nothing 404s). Wrapped in try/catch so a CDN hiccup never breaks the app.
function TripMap({ stops }) {
const ref = useRef(null);
const mapRef = useRef(null);
useEffect(() => {
if (!ref.current || mapRef.current) return;
if (!L || !L.map) return;
try {
const map = L.map(ref.current, { scrollWheelZoom: false, zoomControl: true, attributionControl: true });
mapRef.current = map;
L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
maxZoom: 19, attribution: '&copy; OpenStreetMap &copy; CARTO',
}).addTo(map);
const latlngs = stops.map(s => [s.lat, s.lon]);
L.polyline(latlngs, { color: "#41599C", weight: 3, opacity: .85, dashArray: "6,9" }).addTo(map);
stops.forEach((s, i) => {
L.circleMarker([s.lat, s.lon], { radius: 7, color: "#fff", weight: 2.5, fillColor: "#41599C", fillOpacity: 1 })
.addTo(map).bindTooltip(`${i + 1}. ${s.name}`, { direction: "top", offset: [0, -6] });
});
map.fitBounds(latlngs, { padding: [34, 34] });
setTimeout(() => { try { map.invalidateSize(); map.fitBounds(latlngs, { padding: [34, 34] }); } catch (e) {} }, 250);
} catch (e) { /* leave the empty box; the rest of the recap still renders */ }
return () => { try { if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; } } catch (e) {} };
}, []);
return <div className="tripmap" ref={ref} />;
}

function TripRecap(ctx) {
const { state, canEdit, session, flash } = ctx;
const [viewer, setViewer] = useState(null);
const [story, setStory] = useState(() => { try { return JSON.parse(localStorage.getItem("euro26:story") || "null"); } catch (e) { return null; } });
const [storyBusy, setStoryBusy] = useState(false);
const journal = state.journal || [];
const meals = journal.filter(j => j.type === "Meal");
const wines = journal.filter(j => j.type === "Wine");
const score = j => (j.you || 0) + (j.her || 0);
const bestMeal = [...meals].sort((a, b) => score(b) - score(a)).find(j => score(j) > 0);
const bestWine = [...wines].sort((a, b) => score(b) - score(a)).find(j => score(j) > 0);
const allPhotos = journal.flatMap(j => (j.photos || []));
const euro = ITINERARY.filter(d => d.city !== "Transit" && d.country !== "Australia");
const cities = [...new Set(euro.map(d => d.city))];
const countries = [...new Set(euro.map(d => d.country))];
const today = todayIndex();
const dayNow = Math.min(today + 1, TRIP.total);
const ended = today >= ITINERARY.length - 1;

const genStory = async () => {
if (!canEdit) { flash("Sign in to write the story"); return; }
if (!journal.length) return;
setStoryBusy(true);
try {
const entries = journal.map(j => ({ type: j.type, title: j.title, city: j.city, you: j.you, her: j.her, note: j.note }));
const text = await aiStory(entries, { name: "Le Grand Tour" }, session && session.access_token);
const obj = { text, n: journal.length };
setStory(obj);
try { localStorage.setItem("euro26:story", JSON.stringify(obj)); } catch (e) {}
} catch (e) { flash("Couldn't write the story"); }
setStoryBusy(false);
};

const renderBest = (j, label) => {
const Ic = TYPE_META[j.type].icon;
return (

<div className="jcard-rate"><MiniStars label="You" v={j.you} /><MiniStars label="H" v={j.her} /></div>
</div>
</div>
);
};

return (
<div className="page">
<div className="recaphero">
<div className="recaphero-kicker">EUROPE · JUNE 2026</div>
<div className="recaphero-title">Le Grand Tour</div>
<div className="recaphero-route"><Route size={13} /> Sydney → Paris → Bordeaux → Copenhagen → London</div>
<div className="recaphero-dates">4 – 22 June 2026 · 19 days · {ended ? "trip complete" : `day ${dayNow}`}</div>
</div>

{story && story.text && <div className="storycard">{story.text}</div>}
{canEdit && journal.length > 0 && (

<div className="recap-cap">The European leg — four cities, home from Sydney</div>

<div className="ministats"><Stat label="Days" value={19} /><Stat label="Cities" value={cities.length} /><Stat label="Countries" value={countries.length} /></div>
<div className="ministats"><Stat label="Meals" value={meals.length} accent /><Stat label="Wines" value={wines.length} accent /><Stat label="Photos" value={allPhotos.length} accent /></div>

{(bestMeal || bestWine) && <div className="section-label">The best of it</div>}
{bestMeal && renderBest(bestMeal, "Top meal")}
{bestWine && renderBest(bestWine, "Top wine")}

{allPhotos.length > 0 && (
<>
<div className="section-label">Photo highlights</div>
<div className="photogrid recapgrid">
{allPhotos.map((p, i) => <button key={p.id || i} onClick={() => setViewer({ photos: allPhotos, index: i })}><img src={p.src} alt="" loading="lazy" onError={(e) => { const b = e.currentTarget.closest("button"); if (b) b.style.display = "none"; }} /></button>)}
</div>
</>
)}

{journal.length === 0 && <div className="muted sm empty pad">Your recap fills in here as you log meals, wines and moments along the way.</div>}
<div className="photo-credit">City hero photos via Wikimedia Commons — Paris: Getfunky Paris (CC BY 2.0) · Bordeaux: AirScott (CC BY-SA 4.0) · Copenhagen: Jakub Hałun (CC BY-SA 4.0) · London: Aleem Yousaf (CC BY-SA 2.0)</div>

}

function PhotoPicker({ files, setFiles, flash, canEdit }) {
const pick = (fileList) => {
const room = Math.max(0, 4 - files.length);
const selected = Array.from(fileList || []).slice(0, room);
if (!selected.length) return;
const withPreview = selected.map(f => { f.__preview = URL.createObjectURL(f); return f; });
setFiles([...(files || []), ...withPreview]);
flash && flash(`${selected.length} photo${selected.length === 1 ? "" : "s"} ready`);
};
const remove = (idx) => {
const f = (files || [])[idx];
if (f && f.__preview) { try { URL.revokeObjectURL(f.__preview); } catch (e) {} }
setFiles((files || []).filter((_, i) => i !== idx));
};
if (!canEdit) return null;
return (
<div className="photopicker">
<label className="photobtn"><ImagePlus size={15} /> Add photos<input type="file" accept="image/*" multiple onChange={e => pick(e.target.files)} /></label>
<div className="muted xs">Photos upload to shared storage when you save.</div>
{!!(files || []).length && <div className="photochips">{files.map((f, i) => <button key={i} className="photochip" onClick={() => remove(i)}><img src={f.__preview} alt="" /><span>×</span></button>)}</div>}
</div>
);
}

function PhotoGrid({ photos, onOpen }) {
return <div className="photogrid">{photos.map((p, i) => <button key={i} onClick={(e) => { e.stopPropagation(); onOpen(i); }}><img src={p.src} alt="Journal memory" loading="lazy" /></button>)}</div>;
}

function PhotoViewer({ photos, index, onClose }) {
const [i, setI] = useState(index);
const startX = useRef(null);
const onTouchStart = (e) => { startX.current = e.touches[0].clientX; };
const onTouchEnd = (e) => {
if (startX.current == null) return;
const dx = e.changedTouches[0].clientX - startX.current;
startX.current = null;
if (dx <= -40) setI(v => Math.min(v + 1, photos.length - 1));
else if (dx >= 40) setI(v => Math.max(v - 1, 0));
};
return createPortal(
<div className="viewer" onClick={onClose} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
<button className="viewer-x" onClick={onClose} aria-label="Close"><X size={18} /></button>
<img src={photos[i].src} alt="Expanded memory" onClick={e => e.stopPropagation()} />
{photos.length > 1 && (
<div className="viewer-dots" onClick={e => e.stopPropagation()}>
{photos.map((_, n) => <button key={n} className={"dot" + (n === i ? " on" : "")} onClick={() => setI(n)} aria-label={`Photo ${n + 1}`} />)}
</div>
)}
</div>
, document.body);
}

}

/* Run 3: explore edit affordance + destructive action */
.editlink{display:inline-flex;align-items:center;gap:6px;border-radius:0;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--sans);background:var(--fill);color:var(--ink2);margin-left:7px;}
.dangerbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:7px;background:transparent;color:var(--warn);border-radius:0;padding:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);margin-top:8px;}
/* Runs 4-5: capture inbox + agent sort */
.capture{background:var(--surface);border-radius:0;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
.capture-row{display:flex;gap:9px;}
.capture-input{flex:1;background:var(--fill);border-radius:0;padding:11px 13px;font-size:14px;font-family:var(--sans);color:var(--ink);}
.capture-input::placeholder{color:var(--muted);}
.capture-add{width:42px;flex:none;background:var(--accent);color:#fff;border-radius:0;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.capture-add:active{background:var(--accent-d);}
.capture-photo{width:42px;flex:none;background:var(--fill);color:var(--ink2);border-radius:0;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.capture-photo input{display:none;}
.capture-photo:active{background:var(--fill2);}
.capture-photo.busy{opacity:.55;pointer-events:none;}
.tray{margin-top:12px;}
.tray-h{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
.trayrow{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);}
.trayrow:first-of-type{border-top:none;}
.trayrow-raw{flex:1;min-width:0;font-size:13.5px;color:var(--ink2);line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;}
.trayrow-actions{display:flex;align-items:center;gap:4px;flex:none;}
.sortbtn{display:inline-flex;align-items:center;gap:6px;background:var(--powder);color:var(--accent);border-radius:0;padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--sans);}
.sortbtn:disabled{opacity:.6;}
.toast.undo{cursor:pointer;}
.reviewrow{display:flex;gap:11px;align-items:center;padding:11px 2px;border-top:1px solid var(--line);}
.reviewrow:first-of-type{border-top:none;}
.reviewcheck{width:24px;height:24px;flex:none;border-radius:0;background:var(--fill2);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.reviewrow.on .reviewcheck{background:var(--accent);}
.reviewbody{flex:1;min-width:0;cursor:pointer;}
.reviewname{font-size:15.5px;font-weight:600;letter-spacing:-.01em;}
/* ===== Tour recap ===== */
.recaphero{background:linear-gradient(135deg,#41599C 0%,#6F82BC 100%);color:#fff;border-radius:22px;padding:24px;margin-bottom:14px;box-shadow:var(--shadow);}
.recaphero-kicker{font-size:11px;font-weight:700;letter-spacing:.08em;opacity:.85;}
.recaphero-title{font-family:var(--serif);font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1.05;}
.recaphero-route{display:flex;align-items:center;gap:7px;font-size:13px;margin-top:14px;opacity:.96;line-height:1.4;font-weight:500;}
.recaphero-route svg{flex:none;opacity:.9;}
.recaphero-dates{font-size:12.5px;opacity:.82;margin-top:7px;}
.tripmap{position:relative;z-index:0;height:280px;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);background:var(--fill);}
.tripmap .leaflet-container{height:100%;width:100%;font-family:var(--sans);background:var(--fill);}
.tripmap .leaflet-control-attribution{font-size:9px;}
.recap-cap{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 16px;}
.bestcard{display:flex;gap:13px;align-items:flex-start;}
.bestcard-body{flex:1;min-width:0;}
.recapgrid{grid-template-columns:repeat(3,1fr);}
.storycard{background:var(--surface);border-radius:18px;padding:17px 19px;margin-bottom:10px;box-shadow:var(--shadow);font-family:var(--serif);font-size:16px;line-height:1.55;color:var(--ink);font-style:italic;border-left:3px solid var(--accent);}
.storybtn{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--powder);color:var(--accent);border-radius:14px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--sans);margin-bottom:12px;}
.storybtn:disabled{opacity:.6;}
.photo-credit{font-size:11px;color:var(--muted);line-height:1.5;margin:18px 4px 4px;text-align:center;}
/* header share + auth actions */
.syncactions{display:flex;align-items:center;gap:14px;}
/* Desktop scale-up for the personal Le Grand Tour app */
@media (min-width:900px){
body{background:linear-gradient(180deg,#F7F8FB 0%,#ECEFF5 100%);}
.app{max-width:1180px;min-height:100vh;background:var(--bg);box-shadow:0 0 0 1px rgba(0,0,0,.04),0 18px 60px rgba(16,24,40,.08);}
.topbar{padding:22px 32px 16px;}
.topbar-row,.syncrow,.progress{max-width:1120px;margin-left:auto;margin-right:auto;}
.brandline{font-size:34px;}
.kicker{font-size:12px;}
.daychip-num{font-size:20px;}
.scroll{padding-bottom:112px;}
.page{max-width:1120px;margin:0 auto;padding:28px 32px 32px;}
.page-h{font-size:40px;margin:4px 2px 22px;}
.hero{padding:28px;margin-bottom:16px;}
.hero-img{height:290px;width:calc(100% + 56px);margin:-28px -28px 22px;}
.hero-city{font-size:42px;max-width:780px;}
.hero-date,.hero-country,.hero-cond{font-size:15px;}
.hero-weather{min-width:126px;}
.hero-temp{font-size:26px;}
.card,.daycard,.placecard,.privsec,.capture,.storycard{box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 34px rgba(16,24,40,.06);}
.card{padding:18px;}
.ministats,.journal-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
.journal-stats{margin-bottom:10px;}
.photogrid{grid-template-columns:repeat(6,1fr);}
.photogrid.gallery{grid-template-columns:repeat(3,1fr);}
.recapgrid{grid-template-columns:repeat(4,1fr);}
.tripmap{height:390px;}
.sheetcard{max-width:640px;border-radius:0;padding:22px 22px calc(22px + env(safe-area-inset-bottom));}
.tabbar{width:auto;max-width:760px;min-width:620px;bottom:24px;border:1px solid var(--line);box-shadow:0 16px 46px rgba(16,24,40,.16);padding:10px 12px;border-radius:0;background:rgba(255,255,255,.92);}
.tab{min-width:104px;flex-direction:row;justify-content:center;gap:7px;padding:9px 14px;}
.tab span{font-size:13px;font-weight:700;}
.toast{bottom:106px;}
.authcard{max-width:420px;padding:34px 30px;}
.authbrand{font-size:34px;}
}
@media (min-width:1000px){
@supports selector(:has(*)){
.page:has(> .hero){display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,.75fr);gap:16px;align-items:start;}
.page:has(> .hero)>.hero,.page:has(> .hero)>.nudge,.page:has(> .hero)>.ministats{grid-column:1/-1;}
.page:has(> .hero)>.section-label{grid-column:2;margin-top:0;}
.page:has(> .hero)>.card{grid-column:2;}
.page:has(> .hero)>.privsec,.page:has(> .hero)>.homeclock,.page:has(> .hero)>.mapday{grid-column:1;}
.page:has(> .daycard){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.page:has(> .daycard)>.page-h{grid-column:1/-1;}
.page:has(> .daycard)>.daycard{margin-bottom:0;}
.page:has(> .recaphero){display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,.55fr);gap:16px;align-items:start;}
.page:has(> .recaphero)>.recaphero,.page:has(> .recaphero)>.storycard,.page:has(> .recaphero)>.storybtn,.page:has(> .recaphero)>.tripmap,.page:has(> .recaphero)>.recap-cap{grid-column:1;}
.page:has(> .recaphero)>.section-label,.page:has(> .recaphero)>.card,.page:has(> .recaphero)>.ministats{grid-column:2;}
.page:has(> .recaphero)>.photogrid{grid-column:1/-1;}
}
}
/* gentle page transition on tab switch */
@media (prefers-reduced-motion:no-preference){
.page{animation:pagein .26s cubic-bezier(.2,.8,.2,1) both;}
}
@keyframes pagein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
/* ===== desktop / laptop layout — a contained shell, not a stretched phone.
   Keeps Le Grand Tour's flat, sharp identity (no rounded chrome added). ===== */
@media (min-width:1000px){
  body{background:linear-gradient(180deg,#EAEEF7 0%,#F4F7FC 100%);}
  .app{max-width:940px;background:var(--bg);box-shadow:0 0 0 1px rgba(16,24,40,.04),0 30px 90px rgba(16,24,40,.10);}
  .topbar{padding-left:34px;padding-right:34px;}
  .scroll{padding-bottom:120px;}
  .page{max-width:700px;margin:0 auto;padding:24px 24px 8px;}
  .page-h{font-size:34px;}
  .daycard{animation:none;}
  .recapgrid{grid-template-columns:repeat(4,1fr);}
  .tabbar{width:100%;max-width:940px;left:50%;transform:translateX(-50%);}
  .hero{padding:26px;}
}
@media (min-width:1280px){
  .app{max-width:1040px;}
  .tabbar{max-width:1040px;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
}
`}</style>
);
}

createRoot(document.getElementById("root")).render(<App />);
