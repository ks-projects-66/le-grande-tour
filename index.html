function mergedPlaces(state) {
  const added = (state.exploreAdded || []);
  return [...SEED_PLACES, ...added].map(p => {
    const st = (state.exploreStatus && state.exploreStatus[p.id]) || {};
    const plannedDay = ("plannedDay" in st) ? st.plannedDay : (p.defaultDay != null ? p.defaultDay : null);
    return { ...p, plannedDay, been: !!st.been, rated: !!st.rated };
  });
}
function questionFor(p) {
  if (p.cat === "See & Do") return `${p.name}. Glad you went?`;
  if (p.cat === "Shop") return `Find anything at ${p.name}?`;
  if (p.tag === "Wine bar") return `What were you drinking at ${p.name}?`;
  if (p.tag === "Sweet treat" || p.tag === "Coffee & cake") return `How was ${p.name}?`;
  if (p.tag === "Fancy dinner") return `${p.name}. Worth the bill?`;
  if (p.tag === "Quick bite") return `${p.name}. Quick and good?`;
  return `How was ${p.name}?`;
}
function typeForPlace(p) {
  if (p.cat === "See & Do") return "Sight";
  if (p.cat === "Shop") return "Moment";
  if (p.tag === "Wine bar") return "Wine";
  return "Meal";
}

const STORE_KEY = "euro26:v1";

/* ---------- storage adapter ----------
   Per-device by default (localStorage). To SHARE one synced dataset between
   both phones: create a free bin at jsonbin.io and paste its Bin ID and
   X-Master-Key below. Leave blank to keep each phone separate. */
const SYNC = { binId: "", masterKey: "" };
const syncEnabled = () => Boolean(SYNC.binId && SYNC.masterKey);
const store = {
  syncEnabled,
  async get() {
    if (syncEnabled()) {
      try {
        const r = await fetch(`https://api.jsonbin.io/v3/b/${SYNC.binId}/latest`, {
          headers: { "X-Master-Key": SYNC.masterKey, "X-Bin-Meta": "false" },
        });
        if (r.ok) return await r.json();
      } catch (e) {}
    }
    try { const v = localStorage.getItem(STORE_KEY); return v ? JSON.parse(v) : null; }
    catch (e) { return null; }
  },
  async set(data) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {}
    if (syncEnabled()) {
      try {
        await fetch(`https://api.jsonbin.io/v3/b/${SYNC.binId}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json", "X-Master-Key": SYNC.masterKey },
          body: JSON.stringify(data),
        });
      } catch (e) {}
    }
  },
};
const uid = () => Math.random().toString(36).slice(2, 9);
const todayCanon = () => new Date().toLocaleDateString("en-CA");

function todayIndex() {
  const t = todayCanon();
  const idx = ITINERARY.findIndex(d => d.date === t);
  if (idx >= 0) return idx;
  if (t < ITINERARY[0].date) return 0;
  return ITINERARY.length - 1;
}

function WeatherGlyph({ kind, size = 22 }) {
  const p = { size, strokeWidth: 1.6 };
  if (kind === "sun") return <Sun {...p} />;
  if (kind === "cloud") return <Cloud {...p} />;
  if (kind === "cloudrain") return <CloudRain {...p} />;
  return <CloudSun {...p} />;
}

/* ============================== ROOT ============================== */

function App() {
  const tIndex = useMemo(todayIndex, []);
  const [tab, setTab] = useState("today");
  const [loaded, setLoaded] = useState(false);
  const [saved, setSaved] = useState(false);
  const firstSave = useRef(true);
  const [toast, setToast] = useState("");

  const [state, setState] = useState({
    weather: {}, planDone: {}, planAdd: {}, spend: [], journal: [],
    packing: {}, fx: { ...DEFAULT_FX }, hotels: {}, exploreStatus: {}, exploreAdded: [],
  });

  // load
  useEffect(() => {
    let live = true;
    (async () => {
      try {
        const parsed = await store.get();
        if (live && parsed && typeof parsed === "object") {
          setState(s => ({ ...s, ...parsed, fx: { ...DEFAULT_FX, ...(parsed.fx || {}) } }));
        }
      } catch (e) { /* no saved state yet */ }
      if (live) setLoaded(true);
    })();
    return () => { live = false; };
  }, []);

  // save (debounced)
  useEffect(() => {
    if (!loaded) return;
    if (firstSave.current) { firstSave.current = false; return; }
    const h = setTimeout(async () => {
      try {
        await store.set(state);
        setSaved(true); setTimeout(() => setSaved(false), 1400);
      } catch (e) { /* ignore */ }
    }, 600);
    return () => clearTimeout(h);
  }, [state, loaded]);

  const flash = (m) => { setToast(m); setTimeout(() => setToast(""), 1600); };
  const copy = (txt, label) => {
    try { navigator.clipboard.writeText(txt); flash((label || "Copied") + " copied"); }
    catch { flash("Copy failed"); }
  };

  /* derived stats */
  const fx = state.fx;
  const spendAUD = state.spend.reduce((a, e) => a + e.amount * (fx[e.ccy] || 1), 0);
  const wines = state.journal.filter(j => j.type === "Wine").length;
  const meals = state.journal.filter(j => j.type === "Meal").length;
  const rated = state.journal.filter(j => j.you > 0);
  const bestMeal = [...state.journal].filter(j => j.type === "Meal")
    .sort((a, b) => (b.you + b.her) - (a.you + a.her))[0];

  const ctx = { state, setState, fx, tIndex, copy, flash, uid, setTab };

  return (
    <div className="app">
      <Style />
      <div className="grain" />

      <header className="topbar">
        <div className="topbar-row">
          <div>
            <div className="kicker">EUROPE · JUNE 2026</div>
            <div className="brandline">Le Grand Tour</div>
          </div>
          <div className="daychip">
            <span className="daychip-num">Day {Math.min(tIndex + 1, TRIP.total)}</span>
            <span className="daychip-of">/ {TRIP.total}</span>
          </div>
        </div>
        <div className="progress"><div className="progress-fill" style={{ width: `${((tIndex + 1) / TRIP.total) * 100}%` }} /></div>
        {saved && <div className="savedtag">saved</div>}
      </header>

      <main className="scroll">
        {tab === "today"   && <Today {...ctx} />}
        {tab === "days"    && <Days {...ctx} />}
        {tab === "spend"   && <Spend {...ctx} spendAUD={spendAUD} />}
        {tab === "journal" && <Journal {...ctx} stats={{ wines, meals, rated, bestMeal, spendAUD }} />}
        {tab === "explore" && <Explore {...ctx} />}
      </main>

      {toast && <div className="toast">{toast}</div>}

      <nav className="tabbar">
        {[
          { id:"today", label:"Today", Icon:Sun },
          { id:"days", label:"Days", Icon:CalendarDays },
          { id:"spend", label:"Spend", Icon:Wallet },
          { id:"journal", label:"Journal", Icon:BookOpen },
          { id:"explore", label:"Explore", Icon:Compass },
        ].map(({ id, label, Icon }) => (
          <button key={id} className={"tab" + (tab === id ? " active" : "")} onClick={() => setTab(id)}>
            <Icon size={20} strokeWidth={tab === id ? 2.2 : 1.7} />
            <span>{label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

  const spendAUD = state.spend.reduce((a, e) => a + e.amount * (fx[e.ccy] || 1), 0);
  const todaySpend = state.spend.filter(e => e.day === tIndex)
    .reduce((a, e) => a + e.amount * (fx[e.ccy] || 1), 0);

  const planItems = (d.plan || []).map((t, j) => ({ id: `d${tIndex}-p${j}`, t }))
    .concat((state.planAdd[tIndex] || []));

  return (
    <div className="page">
      <div className="hero">
        <div className="hero-top">
          <div>
            <div className="hero-date">{d.dow} {fmtDate(d.date)}</div>

            {d.country && <div className="hero-country"><Globe size={12} /> {d.country}</div>}

            <WeatherGlyph kind={clim.icon} size={34} />
            <div className="hero-temp">{clim.hi}°<span>/ {clim.lo}°</span></div>
          </div>
        </div>
        <div className="hero-cond">{wOverride || `${clim.cond} · ${clim.rain}`}</div>
        <input className="weather-input" placeholder="Tap to set today's real forecast…"
          value={wOverride} onChange={e => setState(s => ({ ...s, weather: { ...s.weather, [tIndex]: e.target.value } }))} />
      </div>

      {toRate > 0 && (
        <button className="nudge" onClick={() => setTab("journal")}>
          <BookOpen size={15} /> {toRate} {toRate === 1 ? "place" : "places"} to rate in your journal
        </button>
      )}

      {d.hotel && (d.hotel.address || d.hotel.note) && (
        <Card>
          <div className="row-icon"><Bed size={16} /><span className="row-title">{d.hotel.name}</span></div>
          {d.hotel.address && <div className="muted sm">{d.hotel.address}</div>}
          {d.hotel.checkin && <div className="muted sm">{d.hotel.checkin}</div>}
          {d.hotel.ref && <button className="reflink" onClick={() => copy(d.hotel.ref, "Booking ref")}><span>{d.hotel.ref}</span><Copy size={13} /></button>}
          {d.hotel.note && <div className="muted sm">{d.hotel.note}</div>}
        </Card>
      )}

      {d.legs.length > 0 && (
        <div className="section-label">Today's moves</div>
      )}
      {d.legs.map((l, i) => <LegRow key={i} leg={l} copy={copy} />)}

      <div className="section-label">Plan</div>
      <Card>
        {planItems.length === 0 && exploreToday.length === 0 && <div className="muted sm empty">Nothing locked in. Add something below as the day unfolds.</div>}
        {planItems.map(p => (
          <button key={p.id} className={"checkrow" + (done[p.id] ? " checked" : "")} onClick={() => toggle(p.id)}>
            <span className="box">{done[p.id] && <Check size={13} strokeWidth={3} />}</span>
            <span className="checktext">{p.t}</span>
          </button>
        ))}
        {exploreToday.map(p => (
          <button key={p.id} className={"checkrow" + (p.been ? " checked" : "")} onClick={() => setState(s => ({ ...s, exploreStatus: { ...s.exploreStatus, [p.id]: { ...(s.exploreStatus[p.id] || {}), been: !p.been } } }))}>
            <span className="box">{p.been && <Check size={13} strokeWidth={3} />}</span>
            <span className="checktext">{p.name}<span className="vibetag inline">{p.tag}</span></span>
          </button>
        ))}
        <QuickAdd placeholder="Add to today…" onAdd={(t) => setState(s => ({ ...s, planAdd: { ...s.planAdd, [tIndex]: [ ...(s.planAdd[tIndex] || []), { id: uid(), t } ] } }))} />
      </Card>

      <div className="ministats">
        <Stat label="Today" value={money(todaySpend, "AUD")} />
        <Stat label="Trip total" value={money(spendAUD, "AUD")} />
        <Stat label="Local" value={CCY[d.ccy].label} />
      </div>
    </div>
  );
}

/* ============================== DAYS ============================== */

function Days({ state, setState, tIndex, copy }) {
  const [open, setOpen] = useState({ [tIndex]: true });
  const toggleOpen = (i) => setOpen(o => ({ ...o, [i]: !o[i] }));

  return (
    <div className="page">
      <div className="page-h">Itinerary</div>
      {ITINERARY.map((d, i) => {
        const clim = CLIMATE[d.w];
        const tz = TZ[d.w] || TZ.Sydney;
        const isOpen = open[i];
        const isToday = i === tIndex;
        const planItems = (d.plan || []).map((t, j) => ({ id: `d${i}-p${j}`, t })).concat((state.planAdd[i] || []));
        const done = state.planDone[i] || {};
        const exploreDay = mergedPlaces(state).filter(p => p.plannedDay === i);
        return (
          <div key={i} className={"daycard" + (isToday ? " today" : "")} style={{ animationDelay: `${Math.min(i, 12) * 28}ms` }}>
            <button className="daycard-head" onClick={() => toggleOpen(i)}>
              <div className="daycard-date">
                <div className="dc-dow">{d.dow}</div>
                <div className="dc-num">{d.date.slice(8)}</div>
              </div>
              <div className="daycard-main">
                <div className="dc-city">{d.disp}{isToday && <span className="todaybadge">today</span>}</div>
                <div className="dc-sub">
                  <span className="wchip"><WeatherGlyph kind={clim.icon} size={13} /> {clim.hi}°</span>
                  <span className="tzchip"><Clock size={12} /> {tzChip(tz)}</span>
                  {d.legs[0] && <span className="dc-leg">{d.legs[0].kind === "train" ? <TrainFront size={12} /> : <Plane size={12} />} {d.legs[0].code}</span>}
                </div>
              </div>
              <ChevronDown size={18} className={"chev" + (isOpen ? " up" : "")} />
            </button>
            {isOpen && (
              <div className="daycard-body">
                <div className="tzline"><Clock size={13} /> {tzFull(tz)}</div>
                {d.hotel && (d.hotel.address || d.hotel.note || d.hotel.editKey) && (
                  <div className="bodyrow"><Bed size={14} />
                    <div>
                      <div className="row-title sm">{d.hotel.name}</div>
                      {d.hotel.address && <div className="muted xs">{d.hotel.address}</div>}
                      {d.hotel.ref && <button className="reflink xs" onClick={() => copy(d.hotel.ref, "Ref")}>{d.hotel.ref} <Copy size={11} /></button>}
                      {d.hotel.editKey && !d.hotel.address && (
                        <input className="inline-input" placeholder="Add accommodation…"
                          value={state.hotels[d.hotel.editKey] || ""} onChange={e => setState(s => ({ ...s, hotels: { ...s.hotels, [d.hotel.editKey]: e.target.value } }))} />
                      )}
                      {d.hotel.note && <div className="muted xs">{d.hotel.note}</div>}
                    </div>
                  </div>
                )}
                {d.legs.map((l, k) => <LegRow key={k} leg={l} copy={copy} compact />)}
                {planItems.map(p => (
                  <button key={p.id} className={"checkrow sm" + (done[p.id] ? " checked" : "")}
                    onClick={() => setState(s => ({ ...s, planDone: { ...s.planDone, [i]: { ...(s.planDone[i] || {}), [p.id]: !(s.planDone[i] || {})[p.id] } } }))}>
                    <span className="box">{done[p.id] && <Check size={12} strokeWidth={3} />}</span>
                    <span className="checktext">{p.t}</span>
                  </button>
                ))}
                {exploreDay.map(p => (
                  <button key={p.id} className={"checkrow sm" + (p.been ? " checked" : "")}
                    onClick={() => setState(s => ({ ...s, exploreStatus: { ...s.exploreStatus, [p.id]: { ...(s.exploreStatus[p.id] || {}), been: !p.been } } }))}>
                    <span className="box">{p.been && <Check size={12} strokeWidth={3} />}</span>
                    <span className="checktext">{p.name}<span className="vibetag inline">{p.tag}</span></span>
                  </button>
                ))}
                <QuickAdd placeholder="Add a stop…" onAdd={(t) => setState(s => ({ ...s, planAdd: { ...s.planAdd, [i]: [ ...(s.planAdd[i] || []), { id: uid(), t } ] } }))} />
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

/* ============================== SPEND ============================== */

function Spend({ state, setState, fx, tIndex, spendAUD }) {
  const d = ITINERARY[tIndex];
  const [amount, setAmount] = useState("");
  const [ccy, setCcy] = useState(d.ccy);
  const [cat, setCat] = useState("Food & drink");
  const [note, setNote] = useState("");
  const [showFx, setShowFx] = useState(false);

  const cats = ["Food & drink", "Wine", "Hotel", "Transport", "Sights", "Shopping", "Other"];

  const add = () => {
    const a = parseFloat(amount);
    if (!a || a <= 0) return;
    setState(s => ({ ...s, spend: [{ id: uid(), amount: a, ccy, cat, note: note.trim(), day: tIndex, ts: Date.now() }, ...s.spend] }));
    setAmount(""); setNote("");
  };
  const del = (id) => setState(s => ({ ...s, spend: s.spend.filter(e => e.id !== id) }));

  // by category
  const byCat = {};
  state.spend.forEach(e => { byCat[e.cat] = (byCat[e.cat] || 0) + e.amount * (fx[e.ccy] || 1); });
  const catRows = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const maxCat = catRows.length ? catRows[0][1] : 1;

  return (
    <div className="page">
      <div className="page-h">Spend</div>

      <div className="bigtotal">
        <div className="bigtotal-label">Trip total</div>
        <div className="bigtotal-num">{money(spendAUD, "AUD")}</div>
        <div className="bigtotal-sub">{state.spend.length} entries · all converted to AUD</div>
      </div>

      <Card>
        <div className="addrow">
          <input className="amt" inputMode="decimal" placeholder="0.00" value={amount} onChange={e => setAmount(e.target.value)} />
          <select className="sel" value={ccy} onChange={e => setCcy(e.target.value)}>
            {Object.keys(CCY).map(c => <option key={c} value={c}>{CCY[c].sym} {c}</option>)}
          </select>
        </div>
        <select className="sel full" value={cat} onChange={e => setCat(e.target.value)}>
          {cats.map(c => <option key={c}>{c}</option>)}
        </select>
        <input className="inline-input full" placeholder="Note (optional)" value={note} onChange={e => setNote(e.target.value)} />
        <button className="primary" onClick={add}><Plus size={15} /> Log spend</button>
      </Card>

      {catRows.length > 0 && (
        <>
          <div className="section-label">Where it's going</div>
          <Card>
            {catRows.map(([c, v]) => (
              <div key={c} className="bar-row">
                <div className="bar-top"><span>{c}</span><span className="bar-val">{money(v, "AUD")}</span></div>
                <div className="bar-track"><div className="bar-fill" style={{ width: `${(v / maxCat) * 100}%` }} /></div>
              </div>
            ))}
          </Card>
        </>
      )}

      <button className="fxtoggle" onClick={() => setShowFx(v => !v)}>
        <span>FX rates (indicative, editable)</span><ChevronDown size={15} className={"chev" + (showFx ? " up" : "")} />
      </button>
      {showFx && (
        <Card>
          <div className="muted xs" style={{ marginBottom: 8 }}>AUD per 1 unit. Update if the real rate drifts.</div>
          {Object.keys(DEFAULT_FX).filter(c => c !== "AUD").map(c => (
            <div key={c} className="fx-row">
              <span>{CCY[c].sym} 1 {c}</span>
              <div className="fx-edit">$ <input className="fx-input" inputMode="decimal" value={fx[c]}
                onChange={e => setState(s => ({ ...s, fx: { ...s.fx, [c]: parseFloat(e.target.value) || 0 } }))} /> AUD</div>
            </div>
          ))}
        </Card>
      )}

      {state.spend.length > 0 && <div className="section-label">Log</div>}
      {state.spend.map(e => (
        <div key={e.id} className="logrow">
          <div className="logrow-main">
            <div className="logrow-top">{CCY[e.ccy].sym}{fmtNum(e.amount)} <span className="logrow-aud">≈ {money(e.amount * (fx[e.ccy] || 1), "AUD")}</span></div>
            <div className="muted xs">{e.cat}{e.note ? ` · ${e.note}` : ""} · {ITINERARY[e.day].disp}</div>
          </div>
          <button className="del" onClick={() => del(e.id)}><Trash2 size={14} /></button>
        </div>
      ))}
    </div>
  );
}

/* ============================== JOURNAL ============================== */

function Journal({ state, setState, fx, tIndex, stats }) {
  const d = ITINERARY[tIndex];
  const [type, setType] = useState("Meal");
  const [title, setTitle] = useState("");
  const [note, setNote] = useState("");
  const [you, setYou] = useState(0);
  const [her, setHer] = useState(0);
  const [region, setRegion] = useState("");
  const [vintage, setVintage] = useState("");

  const add = () => {
    if (!title.trim()) return;
    setState(s => ({ ...s, journal: [{
      id: uid(), type, title: title.trim(), note: note.trim(), you, her,
      region: region.trim(), vintage: vintage.trim(), city: d.city, day: tIndex, ts: Date.now(),
    }, ...s.journal] }));
    setTitle(""); setNote(""); setYou(0); setHer(0); setRegion(""); setVintage("");
  };
  const del = (id) => setState(s => ({ ...s, journal: s.journal.filter(j => j.id !== id) }));

  const avg = (k) => stats.rated.length ? (stats.rated.reduce((a, j) => a + j[k], 0) / stats.rated.length).toFixed(1) : "–";
  const toRate = mergedPlaces(state).filter(p => p.been && !p.rated);

  return (
    <div className="page">
      <div className="page-h">Journal</div>

      <div className="journal-stats">
        <Stat label="Meals" value={stats.meals} />
        <Stat label="Wines" value={stats.wines} />
        <Stat label="You" value={avg("you")} accent />
        <Stat label="Harriet" value={avg("her")} accent />
      </div>

      {stats.bestMeal && (
        <div className="best">
          <Sparkles size={14} /><span>Best meal so far — <strong>{stats.bestMeal.title}</strong> ({stats.bestMeal.city})</span>
        </div>
      )}

      {toRate.length > 0 && (
        <>
          <div className="section-label">Still to rate</div>
          {toRate.map(p => <RatePrompt key={p.id} place={p} setState={setState} tIndex={tIndex} />)}
        </>
      )}

      <Card>
        <div className="typetabs">
          {Object.keys(TYPE_META).map(tp => {
            const Ic = TYPE_META[tp].icon;
            return <button key={tp} className={"typetab" + (type === tp ? " on" : "")} onClick={() => setType(tp)}><Ic size={15} /> {tp}</button>;
          })}
        </div>
        <input className="inline-input full" placeholder={type === "Wine" ? "Producer / wine name…" : type === "Moment" ? "What happened…" : "Name…"} value={title} onChange={e => setTitle(e.target.value)} />
        {type === "Wine" && (
          <div className="addrow">
            <input className="inline-input" placeholder="Region / appellation" value={region} onChange={e => setRegion(e.target.value)} />
            <input className="inline-input vintage" placeholder="Vintage" value={vintage} onChange={e => setVintage(e.target.value)} />
          </div>
        )}
        <input className="inline-input full" placeholder="Tasting note / thoughts…" value={note} onChange={e => setNote(e.target.value)} />
        <div className="ratepair">
          <RateRow label="You" value={you} onChange={setYou} />
          <RateRow label="Harriet" value={her} onChange={setHer} />
        </div>
        <button className="primary" onClick={add}><Plus size={15} /> Add entry</button>
      </Card>

      {state.journal.map(j => {
        const Ic = TYPE_META[j.type].icon;
        const split = j.you > 0 && j.her > 0 && Math.abs(j.you - j.her) >= 2;
        return (
          <div key={j.id} className="jcard">
            <div className="jcard-icon" style={{ color: TYPE_META[j.type].color }}><Ic size={16} /></div>
            <div className="jcard-body">
              <div className="jcard-title">{j.title}{j.vintage ? <span className="vint"> {j.vintage}</span> : ""}</div>
              {(j.region || j.city) && <div className="muted xs">{[j.region, j.city].filter(Boolean).join(" · ")}</div>}
              {j.note && <div className="jcard-note">{j.note}</div>}
              <div className="jcard-rate">
                <MiniStars label="You" v={j.you} />
                <MiniStars label="H" v={j.her} />
                {split && <span className="split">split decision</span>}
              </div>
            </div>
            <button className="del" onClick={() => del(j.id)}><Trash2 size={14} /></button>
          </div>
        );
      })}
      {state.journal.length === 0 && <div className="muted sm empty pad">Log your first meal, glass or moment. By London this becomes the trip diary.</div>}
    </div>
  );
}

/* ============================== EXPLORE ============================== */

function Explore({ state, setState, tIndex, setTab }) {
  const here = ITINERARY[tIndex].city;
  const startCity = EXPLORE_CITIES.includes(here) ? here : "Paris";
  const [city, setCity] = useState(startCity);
  const [vibe, setVibe] = useState("All");
  const [picker, setPicker] = useState(null);
  const [adding, setAdding] = useState(false);

  const places = mergedPlaces(state).filter(p => p.city === city);
  const vibesHere = ["All", ...Array.from(new Set(places.map(p => p.tag)))];
  const shown = vibe === "All" ? places : places.filter(p => p.tag === vibe);
  const doneCount = places.filter(p => p.been).length;
  const cityDays = ITINERARY.map((d, i) => ({ i, d })).filter(x => x.d.city === city);
  const byCat = CATS.map(cat => ({ cat, items: shown.filter(p => p.cat === cat) })).filter(g => g.items.length);

  const setStatus = (id, patch) => setState(s => ({ ...s, exploreStatus: { ...s.exploreStatus, [id]: { ...(s.exploreStatus[id] || {}), ...patch } } }));

  return (
    <div className="page">
      <div className="page-h">Explore</div>

      <div className="citytabs">
        {EXPLORE_CITIES.map(c => (
          <button key={c} className={"citytab" + (city === c ? " on" : "")} onClick={() => { setCity(c); setVibe("All"); setPicker(null); }}>{c}</button>
        ))}
      </div>
      <div className="city-meta">{doneCount} of {places.length} done in {city}</div>

      <div className="vibebar">
        {vibesHere.map(v => (
          <button key={v} className={"vibechip" + (vibe === v ? " on" : "")} onClick={() => setVibe(v)}>{v}</button>
        ))}
      </div>

      {byCat.length === 0 && <div className="muted sm empty pad">No ideas here yet. Add one below.</div>}

      {byCat.map(g => (
        <div key={g.cat}>
          <div className="section-label">{g.cat}</div>
          {g.items.map(p => {
            const planned = p.plannedDay != null;
            const day = planned ? ITINERARY[p.plannedDay] : null;
            return (
              <div key={p.id} className={"placecard" + (p.been ? " been" : "")}>
                <button className="placecheck" onClick={() => setStatus(p.id, { been: !p.been })}>
                  <span className="box">{p.been && <Check size={13} strokeWidth={3} />}</span>
                </button>
                <div className="place-body">
                  <div className="place-top">
                    <span className="place-name">{p.name}</span>
                    <span className="vibetag">{p.tag}</span>
                  </div>
                  {(p.area || p.note) && <div className="muted xs">{[p.area, p.note].filter(Boolean).join(" · ")}</div>}
                  <div className="place-actions">
                    {planned
                      ? <button className="planpill" onClick={() => setPicker(picker === p.id ? null : p.id)}><CalendarDays size={12} /> {day.dow} {fmtDate(day.date)}</button>
                      : <button className="addday" onClick={() => setPicker(picker === p.id ? null : p.id)}><CalendarPlus size={13} /> Add to a day</button>}
                  </div>
                  {picker === p.id && (
                    <div className="daypicker">
                      {cityDays.map(({ i, d }) => (
                        <button key={i} className={"dpbtn" + (p.plannedDay === i ? " on" : "")} onClick={() => { setStatus(p.id, { plannedDay: i }); setPicker(null); }}>{d.dow} {fmtDate(d.date)}</button>
                      ))}
                      {planned && <button className="dpbtn clear" onClick={() => { setStatus(p.id, { plannedDay: null }); setPicker(null); }}>Remove</button>}
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      ))}

      {adding
        ? <AddPlace city={city} onCancel={() => setAdding(false)} onAdd={(place) => { setState(s => ({ ...s, exploreAdded: [ ...(s.exploreAdded || []), place ] })); setAdding(false); }} />
        : <button className="addplace" onClick={() => setAdding(true)}><Plus size={16} /> Add a place</button>}
    </div>
  );
}

function AddPlace({ city, onAdd, onCancel }) {
  const [name, setName] = useState("");
  const [cat, setCat] = useState("Eat & Drink");
  const [tag, setTag] = useState(VIBES[0]);
  const [area, setArea] = useState("");
  const [note, setNote] = useState("");
  const go = () => {
    if (!name.trim()) return;
    onAdd({ id: uid(), city, cat, tag, name: name.trim(), area: area.trim(), note: note.trim() });
  };
  return (
    <Card>
      <input className="inline-input full" placeholder="Place name…" value={name} onChange={e => setName(e.target.value)} />
      <select className="sel full" value={cat} onChange={e => setCat(e.target.value)}>
        {CATS.map(c => <option key={c}>{c}</option>)}
      </select>
      <select className="sel full" value={tag} onChange={e => setTag(e.target.value)}>
        {VIBES.map(v => <option key={v}>{v}</option>)}
      </select>
      <input className="inline-input full" placeholder="Area / neighbourhood (optional)" value={area} onChange={e => setArea(e.target.value)} />
      <input className="inline-input full" placeholder="Note (optional)" value={note} onChange={e => setNote(e.target.value)} />
      <div className="btnrow">
        <button className="primary grow" onClick={go}><Plus size={15} /> Add to {city}</button>
        <button className="ghostbtn" onClick={onCancel}>Cancel</button>
      </div>
    </Card>
  );
}

function RatePrompt({ place, setState, tIndex }) {
  const [you, setYou] = useState(0);
  const [her, setHer] = useState(0);
  const [note, setNote] = useState("");
  const save = () => {
    const day = place.plannedDay != null ? place.plannedDay : tIndex;
    setState(s => ({
      ...s,
      journal: [{ id: uid(), type: typeForPlace(place), title: place.name, note: note.trim(), you, her, region: "", vintage: "", city: place.city, day, ts: Date.now() }, ...s.journal],
      exploreStatus: { ...s.exploreStatus, [place.id]: { ...(s.exploreStatus[place.id] || {}), rated: true } },
    }));
  };
  return (
    <Card>
      <div className="prompt-q">{questionFor(place)}</div>
      <div className="ratepair">
        <RateRow label="You" value={you} onChange={setYou} />
        <RateRow label="Harriet" value={her} onChange={setHer} />
      </div>
      <input className="inline-input full" placeholder="A line on it (optional)…" value={note} onChange={e => setNote(e.target.value)} />
      <button className="primary" onClick={save}><Check size={15} /> Save to journal</button>
    </Card>
  );
}

/* ============================== SHARED UI ============================== */

function Card({ children }) { return <div className="card">{children}</div>; }

function LegRow({ leg, copy, compact }) {
  const Ic = leg.kind === "train" ? TrainFront : Plane;
  return (
    <div className={"leg" + (compact ? " compact" : "")}>
      <div className="leg-ic"><Ic size={15} /></div>
      <div className="leg-body">
        <div className="leg-top"><button className="leg-code" onClick={() => copy(leg.code, leg.code)}>{leg.code} <Copy size={11} /></button><span className="mono">{leg.time}</span></div>
        <div className="leg-route">{leg.route}</div>
        {leg.detail && <div className="muted xs">{leg.detail}</div>}
      </div>
    </div>
  );
}

function QuickAdd({ placeholder, onAdd }) {
  const [v, setV] = useState("");
  const go = () => { if (v.trim()) { onAdd(v.trim()); setV(""); } };
  return (
    <div className="quickadd">
      <input value={v} placeholder={placeholder} onChange={e => setV(e.target.value)}
        onKeyDown={e => { if (e.key === "Enter") go(); }} />
      <button onClick={go}><Plus size={16} /></button>
    </div>
  );
}

function Stat({ label, value, accent }) {
  return <div className={"stat" + (accent ? " accent" : "")}><div className="stat-v">{value}</div><div className="stat-l">{label}</div></div>;
}

function RateRow({ label, value, onChange }) {
  return (
    <div className="raterow">
      <span className="rate-label">{label}</span>
      <div className="stars">
        {[1, 2, 3, 4, 5].map(n => (
          <button key={n} className="starbtn" onClick={() => onChange(n === value ? 0 : n)}>
            <Star size={20} fill={n <= value ? "var(--brass)" : "none"} stroke={n <= value ? "var(--brass)" : "var(--line2)"} strokeWidth={1.5} />
          </button>
        ))}
      </div>
    </div>
  );
}

function MiniStars({ label, v }) {
  return (
    <span className="mini">
      <span className="mini-l">{label}</span>
      {[1, 2, 3, 4, 5].map(n => <Star key={n} size={11} fill={n <= v ? "var(--brass)" : "none"} stroke={n <= v ? "var(--brass)" : "var(--line2)"} strokeWidth={1.5} />)}
    </span>
  );
}

/* ============================== FORMAT ============================== */

function fmtDate(iso) {
  const m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const p = iso.split("-");
  return `${parseInt(p[2], 10)} ${m[parseInt(p[1], 10) - 1]}`;
}
function fmtNum(n) { return n % 1 === 0 ? n.toString() : n.toFixed(2); }
function money(n, c) {
  const v = Math.round(n).toLocaleString("en-AU");
  return `${CCY[c].sym}${v}`;
}
